name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publica SÓ os arquivos do site. conteudo.src.html (texto claro)
      # fica fora de propósito, no repo privado.
      - name: Montar dist (arquivos públicos)
        run: |
          mkdir -p dist
          cp index.html auth.js style.css conteudo.enc dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
